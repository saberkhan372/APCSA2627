name: Check visualizers against real Java
on:
  push:
    paths: ['visualizers/**', '.github/workflows/visualizers-java.yml']
  pull_request:
    paths: ['visualizers/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Page engine matches the case table
        run: node visualizers/tests/run-engine-tests.mjs
      - name: Generated Java check is up to date
        run: |
          node visualizers/tests/make-java-check.mjs
          git diff --exit-code visualizers/tests/CompareToCheck.java
      - name: Real Java matches the case table
        working-directory: visualizers/tests
        run: |
          java CompareToCheck.java | tee result.txt
          echo "::notice title=compareTo vs real Java::$(tail -n 1 result.txt)"
          tail -n 1 result.txt | grep -q '^PASS'
