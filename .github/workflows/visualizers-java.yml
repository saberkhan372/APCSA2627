name: Check visualizers against real Java
on:
  push:
    paths: ['visualizers/**', 'study/**', 'content/study/**', '.github/workflows/visualizers-java.yml']
  pull_request:
    paths: ['visualizers/**', 'study/**', 'content/study/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Page engines and study banks pass their Node checks
        run: for t in visualizers/tests/run-*-tests.mjs study/tests/run-*-tests.mjs; do node "$t"; done
      - name: Study banks and generated Java checks are up to date
        run: |
          for b in study/*-bank.mjs; do node "$b"; done
          for g in visualizers/tests/make-*-java.mjs study/tests/make-*-java.mjs; do node "$g"; done
          git diff --exit-code visualizers/tests/ study/tests/ content/study/
      - name: Real Java matches every case table and study item
        run: |
          status=0
          summary=""
          for j in visualizers/tests/*Check.java study/tests/*Check.java; do
            (cd "$(dirname "$j")" && java "$(basename "$j")") | tee "$j.txt"
            name=$(basename "$j" .java)
            summary="$summary%0A$name: $(tail -n 1 "$j.txt")"
            grep '^FAIL' "$j.txt" | head -n 8 | while IFS= read -r line; do echo "::error title=$name::$line"; done
            tail -n 1 "$j.txt" | grep -q '^PASS' || status=1
          done
          # One notice for all files: GitHub shows only the first 10 annotations of a step.
          echo "::notice title=Real Java checks::$summary"
          exit $status
      - name: Code tasks - the solution passes and the unfinished starter does not
        run: |
          status=0
          for task in study/code/*/; do
            name=$(basename "$task")
            check=$(basename "$(ls "$task"*Check.java)" .java)
            sol=$(mktemp -d); cp "$task"solution/*.java "$task$check.java" "$sol"/
            if (cd "$sol" && javac *.java && java "$check" > out.txt); then
              echo "::notice title=$name::the reference solution passes $(grep -c '^PASS' "$sol/out.txt") checks"
            else
              cat "$sol/out.txt"; echo "::error title=$name::the reference solution fails its checker"; status=1
            fi
            start=$(mktemp -d); cp "$task"*.java "$start"/
            if (cd "$start" && javac *.java && java "$check" > out.txt); then
              echo "::error title=$name::the unfinished starter passes the checker, so the checks are too weak"; status=1
            elif grep -q '^REVISE' "$start/out.txt"; then
              echo "::notice title=$name::the unfinished starter gets REVISE, as expected"
            else
              echo "::error title=$name::the starter does not compile or run"; status=1
            fi
          done
          exit $status
