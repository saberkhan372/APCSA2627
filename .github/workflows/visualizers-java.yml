name: Check visualizers against real Java
on:
  push:
    paths: ['visualizers/**', '.github/workflows/visualizers-java.yml']
  pull_request:
    paths: ['visualizers/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Page engines match their case tables
        run: for t in visualizers/tests/run-*-tests.mjs; do node "$t"; done
      - name: Generated Java checks are up to date
        run: |
          for g in visualizers/tests/make-*-java.mjs; do node "$g"; done
          git diff --exit-code visualizers/tests/
      - name: Real Java matches every case table
        working-directory: visualizers/tests
        run: |
          status=0
          for j in *Check.java; do
            java "$j" | tee "$j.txt"
            echo "::notice title=${j%.java} vs real Java::$(tail -n 1 "$j.txt")"
            tail -n 1 "$j.txt" | grep -q '^PASS' || status=1
          done
          exit $status
